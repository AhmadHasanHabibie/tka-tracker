<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGradient)" filter="url(#softGlow)" />
  
  <!-- Academic Graduation Cap Top & Target Arrow Graphic -->
  <g transform="translate(0, 0)">
    <!-- Shield / Target Base Geometric Line -->
    <path d="M 140 330 L 220 400 L 370 200" fill="none" stroke="url(#iconGradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Rising Chart Dots & Trend -->
    <path d="M 150 250 L 230 180 L 310 220 L 370 140" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" />
    
    <!-- Accent Dots -->
    <circle cx="370" cy="140" r="18" fill="#ffffff" />
  </g>
</svg>
